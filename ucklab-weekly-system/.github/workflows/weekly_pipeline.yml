name: UCKLab Weekly HBR-Grade AGI Report Pipeline

on:
  schedule:
    # 매주 월요일 오전 07:00 KST = 일요일 22:00 UTC (7일에 1회 자율 실행)
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  weekly-autonomous-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Korean Fonts for Charts & PDFs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install Python Dependencies
        run: |
          cd ucklab-weekly-system
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Weekly HBR Pipeline
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          ADMIN_MASTER_KEY: ${{ secrets.ADMIN_MASTER_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FB_GROUP_ID: ${{ secrets.FB_GROUP_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          cd ucklab-weekly-system
          echo "=== Executing Weekly HBR Autonomous Publisher ==="
          python src/wp_publisher.py
          echo "=== Executing Weekly HBR 5,000-Word Pipeline & Verification Suite ==="
          cd ..
          python ucklab_weekly_hbr_pipeline.py

      - name: Upload Weekly Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-reports-${{ github.run_id }}
          path: |
            ucklab-weekly-system/storage/
            ucklab-weekly-system/data/
          retention-days: 14
