name: UCKLab Daily Top 10 News & AGI Report Pipeline

on:
  schedule:
    # 매주 1회 (7일에 1번) 월요일 오전 07:00 KST = 일요일 22:00 UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  daily-autonomous-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Korean Fonts for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install Python Dependencies
        run: |
          cd ucklab-daily-system
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Pipeline Sequence
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ucklab-daily-system
          echo "=== 1. Headlines Collection ==="
          python src/collector.py

          echo "=== 2. Dual-Language News & Visual Generation ==="
          python src/generator.py

          echo "=== 3. Dr. Chang-bae Lee Column Generation ==="
          python src/column.py

          echo "=== 4. Master PDF Compilation & Media Upload ==="
          python scripts/publish_daily_pdf_media.py

          echo "=== 5. WordPress REST API Autonomous Publishing ==="
          python src/wp_publisher.py

      - name: Upload Daily PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: ucklab-daily-system/storage/reports/
          retention-days: 7
